name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Smoke-test the CLI on the example incidents
        run: |
          incident-pattern-miner analyze examples/postmortems examples/incidents.csv > report.md
          diff report.md examples/report.md
          incident-pattern-miner analyze examples/postmortems --format html -o report.html
